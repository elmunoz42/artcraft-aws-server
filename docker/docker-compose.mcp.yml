# MCP add-on: lets AI agents drive the headless Craft apps (PhotoCraft, VectorCraft, ...).
# scripts/compose.sh adds this file when MCP_ENABLED=true in .env. See docs/mcp.md.
#
#   agent --HTTP + bearer token--> mcp-proxy (Caddy, published port)
#                                     --> mcp-bridge (supergateway -> command bridge -> <app>-cli)
#
# The bridge runs commands chosen by an agent, so it is treated as untrusted:
# it has no route out (no internet, no instance metadata, no database or storage
# containers), runs unprivileged on a read-only filesystem, and sees only the workspace.
services:
  mcp-bridge:
    build:
      context: ./mcp
      args:
        MCP_APPS: ${MCP_APPS:-photocraft vectorcraft designcraft deckcraft pdfcraft}
    image: artcraft-cloud/mcp-bridge:local
    restart: unless-stopped
    networks: [mcp-internal]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: ${MCP_MEM_LIMIT:-1g}
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - ${DATA_DIR:-/data/artcraft}/craft-work:/work
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  mcp-proxy:
    image: ${CADDY_IMAGE:-caddy:2.11.9-alpine}
    restart: unless-stopped
    depends_on:
      mcp-bridge:
        condition: service_healthy
    networks: [mcp-internal, mcp-edge]
    ports:
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-8811}:8811"
    environment:
      MCP_TOKEN: ${MCP_TOKEN:?set MCP_TOKEN in .env (scripts/bootstrap.sh generates one)}
    read_only: true
    cap_drop: [ALL]
    # The Caddy binary carries this file capability; without it the container cannot start.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /config
      - /data
    volumes:
      - ./mcp/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:-/data/artcraft}/craft-work/outputs:/srv/outputs:ro
    mem_limit: 128m

networks:
  # No gateway to the outside: containers here cannot reach the internet or 169.254.169.254.
  mcp-internal:
    internal: true
  mcp-edge: {}
